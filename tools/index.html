<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1D23" />
    <meta name="description" content="虚拟货币交易平台 - 专业的加密货币交易工具" />

    <!-- iOS PWA 支持 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="交易平台" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- 安全相关 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- 禁止缓存敏感信息 -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v3.png" />
    <title>虚拟货币交易平台</title>

    <style>
      /* 防止 FOUC (Flash of Unstyled Content) */
      /* 启动阶段使用页面主背景，减少 iOS 网页 App 冷启动灰屏观感 */
      html,
      body,
      #root {
        height: var(--app-height, 100vh);
      }
      html {
        background-color: #0B0E11;
        min-height: 100%;
        min-height: -webkit-fill-available;
      }
      html.light { background-color: #ffffff; }
      /* iOS safe area 支持 & 高度链 */
      body {
        min-height: var(--app-height, 100vh);
        margin: 0;
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        overscroll-behavior-y: none;
      }
      #root {
        min-height: var(--app-height, 100vh);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 内联闪屏：HTML 解析即显示，消除 iOS 桌面 App 启动黑屏；React 首帧后由 main.tsx 移除 -->
    <div
      id="app-splash"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0b0e11;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      "
    >
      <div
        style="
          width: 36px;
          height: 36px;
          border-radius: 50%;
          border: 3px solid #2b3139;
          border-top-color: #f0b90b;
          animation: app-splash-spin 0.8s linear infinite;
        "
      ></div>
      <div style="color: #848e9c; font-size: 12px; letter-spacing: 2px">交易平台</div>
      <style>
        @keyframes app-splash-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
