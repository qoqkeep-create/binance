spring:
  datasource:
    url: jdbc:h2:mem:trade_tool_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    locations: classpath:db/test-migration,classpath:db/migration/common
  data:
    redis:
      host: 127.0.0.1
      port: 6379

binance:
  usdm:
    continuous-kline:
      enabled: false

market:
  kline:
    enabled: false
    backfill-enabled: false
    continuity-guard-enabled: false

strategy:
  super-ema-pullback:
    enabled: false

trading:
  sync:
    enabled: false
