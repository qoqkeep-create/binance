x-python: &python
  image: tradetools-integrated:${INTEGRATED_RELEASE:-local}
  build:
    context: .
    dockerfile: deploy/integrated/Dockerfile
  env_file: ./server.env
  restart: unless-stopped
  profiles: [pro]
  init: true
  read_only: true
  tmpfs: [/tmp:size=32m]
  networks: [default]
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  mysql:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    profiles: [pro]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set an independent MySQL root password}
      MYSQL_DATABASE: ${DB_NAME:-tradetools_integrated}
      MYSQL_USER: ${DB_USER:-tt_integrated}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set an independent database password}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --innodb-buffer-pool-size=128M, --max-connections=100]
    mem_limit: 1g
    memswap_limit: 2g
    volumes: [integrated-mysql:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -uroot -N -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    <<: *python
    ports: ['127.0.0.1:8787:8787']
    mem_limit: 256m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/v1/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3
  market:
    <<: *python
    command: [python, manage.py, market_stream]
    mem_limit: 192m
    healthcheck:
      test: [CMD, python, manage.py, integration_health, market]
      interval: 30s
      timeout: 8s
      start_period: 120s
      retries: 3
  worker:
    <<: *python
    command: [python, manage.py, mobile_worker]
    mem_limit: 192m
    healthcheck:
      test: [CMD, python, manage.py, integration_health, worker]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3
  scheduler:
    <<: *python
    volumes:
      - type: bind
        source: ${APNS_SECRET_DIRECTORY:-/opt/trade-tools-integrated/secrets}
        target: /run/tradetools-secrets
        read_only: true
    command: [python, manage.py, run_scheduler]
    mem_limit: 192m
    healthcheck:
      test: [CMD, python, manage.py, integration_health, scheduler]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3
  redis:
    image: redis:7.4-alpine
    profiles: [pro]
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory, 80mb, --maxmemory-policy, noeviction]
    mem_limit: 128m
    volumes: [integrated-redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
volumes:
  integrated-mysql:
  integrated-redis:
