services:
  mysql-integration:
    image: mysql:8.4
    mem_limit: 512m
    cpus: 0.5
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
    environment:
      MYSQL_DATABASE: riskon_integration
      MYSQL_ROOT_PASSWORD: integration-only-root-password
      MYSQL_ROOT_HOST: "%"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -pintegration-only-root-password --silent",
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-integration:
    image: redis:7-alpine
    mem_limit: 64m
    cpus: 0.25
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  test-runner:
    mem_limit: 384m
    cpus: 0.5
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    environment:
      SECRET_KEY: integration-only-secret-key-not-for-production
      AES_SECRET_KEY: integration-only-aes-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,test-runner
      CORS_ALLOW_ALL_ORIGINS: "False"
      CORS_ALLOWED_ORIGINS: https://localhost
      AUTH_REFRESH_COOKIE_SECURE: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      DB_ENGINE: mysql
      DB_HOST: mysql-integration
      DB_PORT: "3306"
      DB_NAME: riskon_integration
      DB_USER: root
      DB_PASSWORD: integration-only-root-password
      USE_REDIS_CACHE: "True"
      REDIS_URL: redis://redis-integration:6379/0
      RUN_INTEGRATION_TESTS: "1"
      RUN_SCHEDULER_IN_WEB: "false"
    depends_on:
      mysql-integration:
        condition: service_healthy
      redis-integration:
        condition: service_healthy
    command: ["python", "manage.py", "test", "integration_tests", "--verbosity", "2"]

networks:
  default:
    internal: true
