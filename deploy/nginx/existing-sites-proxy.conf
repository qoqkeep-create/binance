map $http_upgrade $riskon_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ba.wow211.com www.ba.wow211.com 47.236.86.243;

    location ^~ /webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Gitee-Token $http_x_gitee_token;
    }

    location ^~ /.well-known/acme-challenge/ {
        alias /var/lib/docker/volumes/tradetools_static_data/_data/.well-known/acme-challenge/;
        default_type text/plain;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name claw.wow211.com www.claw.wow211.com;

    location / {
        return 410;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name ba.wow211.com www.ba.wow211.com 47.236.86.243;

    ssl_certificate /etc/letsencrypt/live/ba.wow211.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ba.wow211.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $riskon_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_ssl_server_name on;
        proxy_ssl_name ba.wow211.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name claw.wow211.com www.claw.wow211.com;

    ssl_certificate /etc/letsencrypt/live/ba.wow211.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ba.wow211.com/privkey.pem;

    location / {
        return 410;
    }
}
