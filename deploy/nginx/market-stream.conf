# Install on the origin host only after the stream.ba.wow211.com certificate
# has been issued. This server intentionally exposes no application routes.
limit_req_zone $binary_remote_addr zone=origin_kline_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=origin_kline_clients:10m;
limit_conn_zone $server_name zone=origin_kline_total:10m;

server {
    listen 80;
    listen [::]:80;
    server_name stream.ba.wow211.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stream.ba.wow211.com;
    ssl_certificate /etc/letsencrypt/live/stream.ba.wow211.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.ba.wow211.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;

    location ~ "^/market-stream/([a-z0-9]{2,30})@kline_(1m|3m|5m|15m|30m|1h|2h|4h|1d)$" {
        limit_except GET { deny all; }
        limit_req zone=origin_kline_rate burst=20 nodelay;
        limit_req_status 429;
        limit_conn origin_kline_clients 64;
        limit_conn origin_kline_total 256;
        limit_conn_status 429;

        proxy_pass https://fstream.binance.com/market/ws/$1@kline_$2;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name fstream.binance.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host fstream.binance.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-API-Key "";
        proxy_set_header X-MBX-APIKEY "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 25h;
        proxy_send_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / { return 404; }
}
