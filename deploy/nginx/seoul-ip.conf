# Seoul test API. Certbot renews this short-lived IP certificate via webroot.
map $http_upgrade $trade_tool_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name 47.80.22.243;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trade-tool-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://47.80.22.243$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name 47.80.22.243;

    ssl_certificate /etc/letsencrypt/live/trade-tool-seoul-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trade-tool-seoul-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TradeToolSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;
    access_log /var/log/nginx/trade-tool.access.log;
    error_log /var/log/nginx/trade-tool.error.log warn;

    location /ws/ {
        proxy_pass http://127.0.0.1:8686;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $trade_tool_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8686;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 95s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
