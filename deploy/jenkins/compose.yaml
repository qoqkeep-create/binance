services:
  jenkins:
    # 使用本目录 Dockerfile 构建带 Git 和流水线插件的 Jenkins 镜像。
    build:
      context: .
      dockerfile: Dockerfile
    image: oovso/jenkins-docker:lts-jdk21
    container_name: jenkins
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: >-
        -Duser.timezone=Asia/Shanghai
        -Dfile.encoding=UTF-8

    volumes:
      # 宿主机目录需要归属 UID:GID 1000:1000。
      - /opt/jenkins/data:/var/jenkins_home
