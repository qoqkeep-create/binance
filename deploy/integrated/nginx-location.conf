# Include within the 47.80.22.243 (Seoul) HTTPS server block.
location = /integrated { return 308 /integrated/; }
location ^~ /integrated/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $integrated_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 10s;
    proxy_read_timeout 95s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    # K-line snapshots (~400 KiB JSON) are compressed here, off the app process.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json;
    gzip_vary on;
}
