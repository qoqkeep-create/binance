# ba.wow211.com -> integrated web (Seoul 47.80.22.243).
# Install as /etc/nginx/sites-enabled/ba-wow211; snippet tradetools-integrated.conf
# comes from nginx-location.conf. Cert lineage ba.wow211.com via certbot webroot
# /var/www/tradetools-integrated-acme; ALLOWED_HOSTS must include ba.wow211.com.
server {
    listen 80;
    server_name ba.wow211.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tradetools-integrated-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://ba.wow211.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ba.wow211.com;

    ssl_certificate /etc/letsencrypt/live/ba.wow211.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ba.wow211.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IntegratedSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;
    access_log /var/log/nginx/ba-wow211.access.log;
    error_log /var/log/nginx/ba-wow211.error.log warn;

    include /etc/nginx/snippets/tradetools-integrated.conf;

    location = / { return 308 /integrated/market/; }
    location / { return 404; }
}