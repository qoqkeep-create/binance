# 47.80.22.243 (Seoul): integrated API only.
map $http_upgrade $integrated_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name 47.80.22.243;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tradetools-integrated-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://47.80.22.243$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name 47.80.22.243;

    # Reuse the valid IP certificate; its Certbot lineage name is retained.
    ssl_certificate /etc/letsencrypt/live/trade-tool-seoul-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trade-tool-seoul-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IntegratedSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;
    access_log /var/log/nginx/tradetools-integrated.access.log;
    error_log /var/log/nginx/tradetools-integrated.error.log warn;

    include /etc/nginx/snippets/tradetools-integrated.conf;

    location / { return 404; }
}
