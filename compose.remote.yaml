name: ${COMPOSE_PROJECT_NAME:-trade-tool}

services:
  trade_mysql:
    image: mysql:latest@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
    container_name: trade_mysql
    restart: unless-stopped
    mem_limit: ${MYSQL_MEMORY_LIMIT:-768m}
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trade-tool}
      MYSQL_USER: ${MYSQL_USER:-trade_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${INFRA_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-/opt/trade-tool/mysql/data}:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 60s
    networks:
      - trade_network

  trade_redis:
    image: redis:latest@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
    container_name: trade_redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "${INFRA_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - ${REDIS_DATA_DIR:-/opt/trade-tool/redis/data}:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping 2>/dev/null | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - trade_network

  trade_app:
    image: ${APP_IMAGE:-trade-tool-app}:${APP_TAG:?APP_TAG is required}
    container_name: trade_app
    restart: unless-stopped
    init: true
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    ports:
      - "${APP_PORT_MAPPING:-127.0.0.1:8686:8686}"
    environment:
      TZ: Asia/Shanghai
      BINANCE_QUOTE_ASSET: ${BINANCE_QUOTE_ASSET:-USDC}
      BINANCE_MARKET_TICKER_MESSAGE_MAX_BYTES: ${BINANCE_MARKET_TICKER_MESSAGE_MAX_BYTES:-1048576}
      BINANCE_TRADING_REST_BASE_URL: ${BINANCE_TRADING_REST_BASE_URL:-https://fapi.binance.com}
      BINANCE_TRADING_USER_STREAM_BASE_URL: ${BINANCE_TRADING_USER_STREAM_BASE_URL:-wss://fstream.binance.com/private}
      TRADING_ACCOUNT_SYNC_ENABLED: ${TRADING_ACCOUNT_SYNC_ENABLED:-false}
      TRADING_CREDENTIAL_MASTER_KEY: ${TRADING_CREDENTIAL_MASTER_KEY:-}
      TRADING_CREDENTIAL_KEY_VERSION: ${TRADING_CREDENTIAL_KEY_VERSION:-v1}
      SPRING_DATASOURCE_URL: jdbc:mysql://trade_mysql:3306/${MYSQL_DATABASE:-trade-tool}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      MYSQL_USER: ${MYSQL_USER:-trade_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: trade_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      APP_ADMIN_ACCOUNT: ${APP_ADMIN_ACCOUNT:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_DISPLAY_NAME: ${APP_ADMIN_DISPLAY_NAME:-Administrator}
      APP_REGISTRATION_ENABLED: ${APP_REGISTRATION_ENABLED:-false}
      LOG_FILE: ${LOG_FILE:-/app/logs/trade-tool.log}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-50MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-2GB}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx640m -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Shanghai -Dio.netty.noUnsafe=true}
      EXTERNAL_MESSAGE_ENABLED: ${EXTERNAL_MESSAGE_ENABLED:-${EXTERNAL_TRADE_SIGNAL_ENABLED:-false}}
      EXTERNAL_MESSAGE_API_KEY: ${EXTERNAL_MESSAGE_API_KEY:-${EXTERNAL_TRADE_SIGNAL_API_KEY:-}}
      REFERENCE_TRADE_NOTIFICATION_TARGET_EMAIL: ${REFERENCE_TRADE_NOTIFICATION_TARGET_EMAIL:-475842526@qq.com}
      APNS_NOTIFICATION_ENABLED: ${APNS_NOTIFICATION_ENABLED:-false}
      WEBHOOK_NOTIFICATION_ENABLED: ${WEBHOOK_NOTIFICATION_ENABLED:-false}
      STRATEGY_SIGNAL_WEBHOOK_URL: ${STRATEGY_SIGNAL_WEBHOOK_URL:-}
      STRATEGY_SIGNAL_WEBHOOK_KEY: ${STRATEGY_SIGNAL_WEBHOOK_KEY:-}
      WEBHOOK_NOTIFICATION_ZONE_ID: ${WEBHOOK_NOTIFICATION_ZONE_ID:-Asia/Shanghai}
      WEBHOOK_CONNECT_TIMEOUT_MILLIS: ${WEBHOOK_CONNECT_TIMEOUT_MILLIS:-5000}
      WEBHOOK_REQUEST_TIMEOUT_MILLIS: ${WEBHOOK_REQUEST_TIMEOUT_MILLIS:-10000}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-3}
      WEBHOOK_RETRY_DELAY_MILLIS: ${WEBHOOK_RETRY_DELAY_MILLIS:-1000}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY_BASE64: ${APNS_PRIVATE_KEY_BASE64:-}
      APNS_TOPIC: ${APNS_TOPIC:-com.oovso.trade}
      APNS_REQUEST_TIMEOUT_MILLIS: ${APNS_REQUEST_TIMEOUT_MILLIS:-10000}
      APNS_EXPIRATION_SECONDS: ${APNS_EXPIRATION_SECONDS:-21600}
      APNS_MAX_ATTEMPTS: ${APNS_MAX_ATTEMPTS:-3}
      APNS_RETRY_DELAY_MILLIS: ${APNS_RETRY_DELAY_MILLIS:-1000}
    volumes:
      - ${LOG_DIR:-./logs}:/app/logs
    depends_on:
      trade_mysql:
        condition: service_healthy
      trade_redis:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - trade_network

networks:
  trade_network:
    name: trade_network
    driver: bridge
